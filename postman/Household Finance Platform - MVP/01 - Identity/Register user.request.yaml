$kind: http-request
url: "{{identity_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "Password123!",
      "firstName": "Ana",
      "lastName": "Gomez"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('email', 'mvp-' + pm.variables.replaceIn('{{$randomUUID}}') + '@example.com');
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.environment.set('access_token', body.accessToken);
      pm.environment.set('refresh_token_id', body.refreshTokenId);
      pm.environment.set('refresh_token', body.refreshToken);
      pm.test('created', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
order: 1000
