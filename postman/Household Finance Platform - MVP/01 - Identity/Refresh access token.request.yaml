$kind: http-request
url: "{{identity_url}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "refreshTokenId": "{{refresh_token_id}}", "refreshToken": "{{refresh_token}}" }'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.environment.set('access_token', body.accessToken);
      pm.environment.set('refresh_token_id', body.refreshTokenId);
      pm.environment.set('refresh_token', body.refreshToken);
order: 5000
