$kind: http-request
url: "{{finance_url}}/api/v1/households/{{household_id}}/categories"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: '{ "name": "Salario" }'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.environment.set('category_id', body.id);
      pm.test('category created', () => pm.expect(pm.response.code).to.eql(201));
order: 3000
