$kind: http-request
url: "{{finance_url}}/api/v1/households"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: '{ "name": "Hogar MVP" }'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.environment.set('household_id', body.id);
      pm.test('household created', () => pm.expect(pm.response.code).to.eql(201));
order: 1000
