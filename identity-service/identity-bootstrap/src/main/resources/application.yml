server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: identity-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USER:identity_service}
    password: ${IDENTITY_DB_PASSWORD:identity_service}
    hikari:
      maximum-pool-size: ${IDENTITY_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

identity:
  security:
    jwt:
      secret: ${IDENTITY_JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
      issuer: ${IDENTITY_JWT_ISSUER:household-finance-platform}
      audience: ${IDENTITY_JWT_AUDIENCE:household-finance-clients}
      access-token-ttl: ${IDENTITY_JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${IDENTITY_JWT_REFRESH_TTL:P30D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{correlationId}]"
  level:
    root: INFO
    com.householdfinance: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    com.householdfinance: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/identity
