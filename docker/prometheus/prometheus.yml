global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]

  - job_name: household-finance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["household-finance-service:8082"]
